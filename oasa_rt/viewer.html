<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Λεωφορεία live</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --panel: rgba(255, 255, 255, .95); --border: #d2d2d7;
    --ontime: #1a7f37; --late1: #a87c00; --late2: #d9480f; --late3: #c92a2a; --none: #6c757d; --warn-bg: #fff3cd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --fg: #f5f5f7; --muted: #a1a1a6; --panel: rgba(28, 28, 30, .95); --border: #3a3a3c; --warn-bg: #4a3b00;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111113; --fg: #f5f5f7; --muted: #a1a1a6; --panel: rgba(28, 28, 30, .95); --border: #3a3a3c; --warn-bg: #4a3b00;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; z-index: 1000; width: 300px; max-width: calc(100% - 64px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  .muted { color: var(--muted); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 6px; margin: 10px 0; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat b small { font-size: 13px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 8px 0 10px; font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  select { width: 100%; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font: inherit; }
  #warn { display: none; margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: var(--warn-bg); font-size: 12px; }
  .bus { width: 34px; height: 20px; border-radius: 10px; color: #fff; font: 600 11px/16px system-ui, sans-serif;
    text-align: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); box-sizing: border-box;
    white-space: nowrap; overflow: hidden; }
  .ontime { background: var(--ontime); } .late1 { background: var(--late1); } .late2 { background: var(--late2); }
  .late3 { background: var(--late3); } .none { background: var(--none); }
  .leaflet-popup-content { font-size: 13px; min-width: 230px; }
  .leaflet-popup-content h3 { margin: 0 0 4px; font-size: 14px; }
  .leaflet-popup-content table { border-collapse: collapse; margin: 4px 0; }
  .leaflet-popup-content td { padding: 1px 8px 1px 0; vertical-align: top; }
  .leaflet-popup-content td:first-child { color: #6e6e73; white-space: nowrap; }
  @media (max-width: 520px) { #panel { width: auto; right: 64px; } .stats { gap: 2px; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Λεωφορεία ΟΑΣΑ: live</h1>
  <div class="muted" id="updated">Φόρτωση…</div>
  <div class="stats">
    <div class="stat"><b id="n-veh">–</b><span>οχήματα</span></div>
    <div class="stat"><b id="n-trip">–</b><span>με δρομολόγιο</span></div>
    <div class="stat"><b id="median">–</b><span>διάμεση καθυστ.</span></div>
  </div>
  <div class="legend">
    <span><i class="ontime"></i>έως 2 λεπτά</span><span><i class="late1"></i>2–5 λεπτά</span>
    <span><i class="late2"></i>5–10 λεπτά</span><span><i class="late3"></i>πάνω από 10 λεπτά</span>
    <span><i class="none"></i>χωρίς δρομολόγιο</span>
  </div>
  <select id="line"><option value="">Όλες οι γραμμές</option></select>
  <div id="warn"></div>
</div>
<script>
const POLL_MS = 10000;     // fallback when the live /events stream is unavailable
const GLIDE_MS = 1500;     // vehicles glide to a new position instead of jumping
const STALE_S = 120;
const DEFAULT_ROUTE_COLOR = "#3b5bdb";

// A few pixels of click tolerance so thin route lines are easy to hit.
const map = L.map("map", { zoomControl: false, renderer: L.canvas({ tolerance: 6 }) }).setView([37.98, 23.73], 12);
L.control.zoom({ position: "topright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

const markers = new Map();      // vehicle id -> {marker, line, tripId, color}
const routeLayers = new Map();  // line -> [polyline]
const highlight = L.layerGroup().addTo(map);
let info = { routes: {}, stops: {}, shapes: {} };   // static.json
let trips = {};                                     // trips.json
let fitted = false;
let live = false;        // connected to /events
let lastHeader = null;   // feed header timestamp

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
// 144 -> "2 λεπτά και 24 δευτερόλεπτα"
function duration(sec) {
  sec = Math.round(Math.abs(sec));
  const m = Math.floor(sec / 60), s = sec % 60, parts = [];
  if (m) parts.push(plural(m, "λεπτό", "λεπτά"));
  if (s || !m) parts.push(plural(s, "δευτερόλεπτο", "δευτερόλεπτα"));
  return parts.join(" και ");
}
const fmtDelay = s => s === 0 ? "καμία" : s > 0 ? duration(s) : duration(s) + " νωρίτερα";
const fmtMinutes = s => (s >= 0 ? "+" : "−") + Math.abs(s / 60).toFixed(1).replace(".", ",") + " <small>λεπτά</small>";
const delayClass = d => d == null ? "none" : d <= 120 ? "ontime" : d <= 300 ? "late1" : d <= 600 ? "late2" : "late3";
const clock = t => new Date(t * 1000).toLocaleTimeString("el-GR", { timeZone: "Europe/Athens", hourCycle: "h23" });
const routeOf = id => info.routes[id] || { line: id || "?", name: "", color: "" };

async function getJSON(path) {
  const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(path + ": HTTP " + r.status);
  return r.json();
}

function drawRoutes() {
  for (const [sid, shape] of Object.entries(info.shapes || {})) {
    const r = routeOf(shape.route), color = r.color || DEFAULT_ROUTE_COLOR;
    const line = L.polyline(shape.points, { color }).bindPopup(routePopup(r, shape), popupOptions());
    line.on("popupopen", () => showRoute(sid, shape.stops, color)).on("popupclose", () => highlight.clearLayers());
    if (!routeLayers.has(r.line)) routeLayers.set(r.line, []);
    routeLayers.get(r.line).push(line);
  }
  const select = document.getElementById("line");
  const lines = [...routeLayers.keys()].sort((a, b) => a.localeCompare(b, "el", { numeric: true }));
  select.innerHTML = '<option value="">Όλες οι γραμμές</option>' + lines.map(l => `<option>${esc(l)}</option>`).join("");
}

function applyFilter() {
  const want = document.getElementById("line").value;
  for (const [line, layers] of routeLayers) {
    const show = !want || line === want;
    for (const layer of layers) {
      if (!show) { layer.remove(); continue; }
      layer.setStyle(want ? { weight: 5, opacity: 0.85 } : { weight: 3, opacity: 0.35 }).addTo(map);
    }
  }
  for (const { marker, line } of markers.values()) {
    const show = !want || line === want;
    if (show && !map.hasLayer(marker)) marker.addTo(map);
    if (!show && map.hasLayer(marker)) marker.remove();
  }
}

// Emphasise one route and show its stops (a clicked route, or the trip of a clicked vehicle).
function showRoute(shapeId, stopIds, color) {
  highlight.clearLayers();
  const shape = info.shapes[shapeId];
  if (shape) {
    L.polyline(shape.points, { color: "#fff", weight: 9, opacity: 0.9, interactive: false }).addTo(highlight).bringToFront();
    L.polyline(shape.points, { color, weight: 5, opacity: 1, interactive: false }).addTo(highlight).bringToFront();
  }
  for (const sid of stopIds || []) {
    const s = info.stops[sid];
    if (!s) continue;
    L.circleMarker([s[1], s[2]], { radius: 4, color, weight: 2, fillColor: "#fff", fillOpacity: 1 })
      .bindTooltip(esc(s[0])).addTo(highlight);
  }
}

function routePopup(r, shape) {
  const name = i => esc((info.stops[shape.stops[i]] || [""])[0]);
  return `<h3>${esc(r.line)} <span class="muted">${esc(r.name)}</span></h3>
    ${name(0)} → ${name(shape.stops.length - 1)}<br><span class="muted">${shape.stops.length} στάσεις</span>`;
}

// Pan opened popups clear of the panel: to its right on wide screens, below it on narrow ones.
function popupOptions() {
  const r = document.getElementById("panel").getBoundingClientRect();
  const pad = window.innerWidth < 600 ? L.point(8, r.bottom + 8) : L.point(r.right + 8, 8);
  return { maxWidth: 360, autoPanPaddingTopLeft: pad };
}

function tripLabel(id) {
  const t = trips[id];
  if (!t) return esc(id);
  return `<span title="${esc(id)}">${esc(t.dep)} ${esc(t.from)} → ${esc(t.to)}</span>`;
}

function popupHtml(e, tu, r, now) {
  const v = e.vehicle, trip = v.trip || {};
  const stopName = (info.stops[v.stopId] || [""])[0];
  let state = "δεν αντιστοιχίστηκε σε δρομολόγιο";
  if (tu) state = tu.waiting ? "περιμένει στην αφετηρία" : fmtDelay(tu.delay);
  const rows = [
    ["Όχημα", esc(v.vehicle.id)],
    ["Καθυστέρηση", state],
    trip.tripId ? ["Δρομολόγιο", tripLabel(trip.tripId)] : null,
    v.stopId ? ["Επόμενη στάση", `${esc(stopName)} <span class="muted">(${esc(v.stopId)})</span>`] : null,
    ["Θέση GPS", `<span data-since="${Number(v.timestamp)}">πριν ${duration(Math.max(0, now - Number(v.timestamp)))}</span>`],
  ].filter(Boolean).map(([k, val]) => `<tr><td>${k}</td><td>${val}</td></tr>`).join("");
  return `<h3>${esc(r.line)} <span class="muted">${esc(r.name)}</span></h3><table>${rows}</table>`;
}

async function refresh() {
  const warn = document.getElementById("warn");
  try {
    const [vp, tu, tr] = await Promise.all([getJSON("vehicle_positions.json"), getJSON("trip_updates.json"),
      getJSON("trips.json").catch(() => ({}))]);
    trips = tr;
    const byTrip = {};
    for (const ent of tu.entity || []) {
      const t = ent.tripUpdate, stu = (t.stopTimeUpdate || [])[0] || {};
      byTrip[t.trip.tripId] = { delay: (stu.arrival || stu.departure || {}).delay || 0, waiting: !!stu.departure };
    }
    const header = Number(vp.header.timestamp), now = Date.now() / 1000;
    const seen = new Set(), delays = [];
    for (const e of vp.entity || []) {
      const v = e.vehicle, id = v.vehicle.id, trip = v.trip || {};
      const r = routeOf(trip.routeId);
      const t = trip.tripId ? byTrip[trip.tripId] : null;
      if (t && !t.waiting) delays.push(t.delay);
      seen.add(id);
      const icon = L.divIcon({ className: "", iconSize: [34, 20], iconAnchor: [17, 10],
        html: `<div class="bus ${delayClass(t ? (t.waiting ? 0 : t.delay) : null)}">${esc(r.line)}</div>` });
      const pos = [v.position.latitude, v.position.longitude];
      let m = markers.get(id);
      if (!m) {
        m = { marker: L.marker(pos, { icon }).bindPopup("", popupOptions()) };
        m.marker.on("popupopen", () => {
          const t = trips[m.tripId];
          if (t) showRoute(t.shape, t.stops, m.color);
        }).on("popupclose", () => highlight.clearLayers());
        markers.set(id, m);
      } else {
        m.marker.setIcon(icon);
        glide(m.marker, L.latLng(pos));
      }
      Object.assign(m, { line: r.line, tripId: trip.tripId, color: r.color || DEFAULT_ROUTE_COLOR });
      m.marker.setPopupContent(popupHtml(e, t, r, now));
    }
    for (const [id, m] of markers) if (!seen.has(id)) { m.marker.remove(); markers.delete(id); }
    applyFilter();

    delays.sort((a, b) => a - b);
    document.getElementById("n-veh").textContent = markers.size;
    document.getElementById("n-trip").textContent = Object.keys(byTrip).length;
    document.getElementById("median").innerHTML = delays.length ? fmtMinutes(delays[delays.length >> 1]) : "–";
    lastHeader = header;
    warn.style.display = "none";
    tick();
    if (!fitted && markers.size) {
      map.fitBounds(L.featureGroup([...markers.values()].map(m => m.marker)).getBounds().pad(0.1));
      fitted = true;
    }
  } catch (err) {
    warn.style.display = "block";
    warn.textContent = "Δεν διαβάστηκε το feed: " + err.message;
  }
}

document.getElementById("line").addEventListener("change", () => {
  map.closePopup();
  applyFilter();
  const layers = routeLayers.get(document.getElementById("line").value);
  if (layers) map.fitBounds(L.featureGroup(layers).getBounds().pad(0.05));
});

// Move a marker smoothly to its new position; long jumps (new trip, GPS glitch) are not animated.
function glide(marker, to) {
  const from = marker.getLatLng();
  cancelAnimationFrame(marker._glide);
  if (from.equals(to) || map.distance(from, to) > 3000) { marker.setLatLng(to); return; }
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / GLIDE_MS), e = k * (2 - k);   // ease-out
    marker.setLatLng([from.lat + (to.lat - from.lat) * e, from.lng + (to.lng - from.lng) * e]);
    if (k < 1) marker._glide = requestAnimationFrame(step);
  };
  marker._glide = requestAnimationFrame(step);
}

// Once a second: "πριν …" counters, the status line and the stale-feed warning.
function tick() {
  const now = Date.now() / 1000;
  for (const el of document.querySelectorAll("[data-since]")) {
    el.textContent = "πριν " + duration(Math.max(0, now - Number(el.dataset.since)));
  }
  if (lastHeader == null) return;
  const mode = live ? "ζωντανή ενημέρωση" : `έλεγχος κάθε ${POLL_MS / 1000} δευτερόλεπτα`;
  document.getElementById("updated").innerHTML =
    `Feed: ${clock(lastHeader)} (<span data-since="${lastHeader}">πριν ${duration(Math.max(0, now - lastHeader))}</span>) · ${mode}`;
  const warn = document.getElementById("warn");
  if (now - lastHeader > STALE_S) {
    warn.style.display = "block";
    warn.textContent = "Το feed δεν ανανεώνεται. Τρέχει το πρόγραμμα;";
  }
}

function connectEvents() {
  const source = new EventSource("events");
  source.onopen = () => { live = true; refresh(); };
  source.onmessage = () => refresh();
  source.onerror = () => { live = false; };   // EventSource reconnects by itself
}

getJSON("static.json").then(d => { info = d; drawRoutes(); }).catch(() => {}).finally(() => {
  refresh();
  connectEvents();
  setInterval(() => { if (!live) refresh(); }, POLL_MS);
  setInterval(tick, 1000);
});
</script>
</body>
</html>
